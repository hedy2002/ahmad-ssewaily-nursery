<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5f3d" />
    <title>Cart | Ahmad Siwaily Nursery</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <div class="logo-mark">🌿</div>
          <span>Ahmad Siwaily Nursery</span>
        </div>
        <nav class="nav">
          <a href="/" data-i18n="home">Home</a>
          <a href="/shop.html" data-i18n="shop">Shop</a>
          <a href="/cart.html"><span data-i18n="cart">Cart</span> <span id="cartBadge" class="cart-badge">0</span></a>
        </nav>
        <div class="language-switcher" data-language-switcher></div>
      </div>
    </header>

    <main class="cart-page" id="cartPage">
      <div class="container cart-layout">
        <div class="panel">
          <h2>Shopping Cart</h2>
          <div id="cartItems" class="cart-items"></div>
        </div>
        <aside id="cartSummary" class="panel"></aside>
      </div>
    </main>

    <script src="/languages.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
