<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5f3d" />
    <title>Checkout | Ahmad Siwaily Nursery</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <div class="logo-mark">🌿</div>
          <span>Ahmad Siwaily Nursery</span>
        </div>
        <nav class="nav">
          <a href="/" data-i18n="home">Home</a>
          <a href="/shop.html" data-i18n="shop">Shop</a>
          <a href="/cart.html" data-i18n="cart">Cart</a>
        </nav>
        <div class="language-switcher" data-language-switcher></div>
      </div>
    </header>

    <main class="checkout-page" id="checkoutPage">
      <div class="container checkout-layout">
        <section class="panel">
          <h2 data-i18n="checkout">Customer Checkout</h2>
          <form id="checkoutForm" class="checkout-form">
            <div class="field">
              <label for="customerName" data-i18n="name">Full Name</label>
              <input id="customerName" name="customerName" type="text" required />
            </div>
            <div class="field">
              <label for="phone" data-i18n="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" required />
            </div>
            <div class="field">
              <label for="address" data-i18n="address">Delivery Location / Address</label>
              <textarea id="address" name="address" rows="4" required></textarea>
            </div>
            <div class="field"><label>Pin precise delivery location</label><div id="deliveryMap" class="delivery-map"></div><input id="latitude" name="latitude" type="hidden"><input id="longitude" name="longitude" type="hidden"></div>
            <div class="field"><label for="promoCode">Promo Code</label><div class="promo-row"><input id="promoCode" name="promoCode" type="text" placeholder="Enter coupon code"><button id="applyPromo" class="btn secondary" type="button">Apply</button></div><small id="promoMessage"></small></div>
            <div class="field">
              <label for="notes">Order Notes (optional)</label>
              <textarea id="notes" name="notes" rows="3"></textarea>
            </div>
            <div class="form-actions">
              <a class="btn secondary" href="/cart.html">Back to Cart</a>
              <button class="btn primary" type="submit">Place Order</button>
            </div>
          </form>
        </section>
        <aside class="panel">
          <h2>Order Summary</h2>
          <div id="checkoutSummary"></div>
        </aside>
      </div>
    </main>

    <script src="/languages.js"></script>
    <script src="/app.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  </body>
</html>
