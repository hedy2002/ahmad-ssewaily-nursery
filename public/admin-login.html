<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Ahmad Siwaily Nursery</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-card">
        <div class="language-switcher" data-language-switcher></div>
        <h1 data-i18n="adminLogin">Admin Login</h1>
        <p class="subtitle">Ahmad Siwaily Nursery Dashboard</p>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="username" data-i18n="username">Username</label>
            <input id="username" name="username" type="text" required />
          </div>

          <div class="form-group">
            <label for="password" data-i18n="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>

          <div class="form-actions">
            <a class="btn btn-secondary" href="/" data-i18n="backStore">Back to Store</a>
            <button class="btn btn-primary" type="submit" data-i18n="login">Login</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/languages.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
