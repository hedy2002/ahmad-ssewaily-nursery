<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەدمین - لۆگین</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .demo-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 13px;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .demo-info strong {
            display: block;
            margin-bottom: 8px;
            color: #667eea;
        }

        .demo-info code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #c33;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            margin-left: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1>ئەدمین پەنێل</h1>
            <p>داخڵ بکە بۆ ئیدارەکردن</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm" method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">ناوی بەکارھێنەر</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="ناوی بەکارھێنەرت تێبنووسە"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">تێپەڕەوشە</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="تێپەڕەوشەت تێبنووسە"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                داخڵ بکە
            </button>
        </form>

        <div class="demo-info">
            <strong>📝 بۆ تاقی کردنەوە بەکارھێنە:</strong>
            ناوی: <code>admin</code><br>
            تێپەڕەوشە: <code>admin123</code>
        </div>

        <div class="back-link">
            <a href="/">← گەڕاوە بۆ سەرەتا</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('تکایە ناوی بەکارھێنەر و تێپەڕەوشە تێبنووسە');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'چاوڕێی کنەوە...';

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                if (response.ok) {
                    window.location.href = '/admin/dashboard';
                } else if (response.status === 401) {
                    showError('ناوی بەکارھێنەر یان تێپەڕەوشە هەڵە');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'داخڵ بکە';
                    document.getElementById('password').value = '';
                } else {
                    showError('هەڵەی سەرئەنجام. تکایە دووبارە هەوڵ بدەوە');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'داخڵ بکە';
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('هەڵەی تێوەردبوون. تکایە دووبارە هەوڵ بدەوە');
                loginBtn.disabled = false;
                loginBtn.textContent = 'داخڵ بکە';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Clear error message when user starts typing
        document.getElementById('username').addEventListener('input', () => {
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
